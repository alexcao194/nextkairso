x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kairso-web:
    logging: *default-logging
    image: ${WEB_IMAGE:-nextkairso:latest}
    container_name: kairso-web
    restart: unless-stopped
    networks:
      - edge
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production

  cloudflared:
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    container_name: nextkairso-cloudflared
    restart: unless-stopped
    networks:
      - edge
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

networks:
  edge:
    external: true
    name: kairso-edge
