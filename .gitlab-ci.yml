# CI/CD: push `main` → build image trên runner → deploy qua SSH vào server prod.
# Không build/deploy trực tiếp trên host nữa; mọi bí mật nằm ở GitLab CI/CD Variables.
#
# Biến CI/CD cần đặt (Settings → CI/CD → Variables):
#   DEPLOY_SSH_KEY      (File hoặc Variable) — private key SSH tới server
#   DEPLOY_HOST         — host/IP server
#   DEPLOY_USER         — user SSH (vd alexcao)
#   DEPLOY_SSH_PORT     — cổng SSH (vd 8022; mặc định 22)
#   DEPLOY_DIR          — tuỳ chọn; mặc định "kairso/web" → ~/kairso/web của DEPLOY_USER
#   TUNNEL_TOKEN        — token Cloudflare Tunnel (chung cho 3 project)
#   WEB_ENV_PRODUCTION  (File) — nội dung .env.production (có APP_SIGNATURE_SECRET…)

stages:
  - build
  - deploy
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/   # tag v* → publish image lên Docker Hub

variables:
  DOCKER_BUILDKIT: "1"
  WEB_IMAGE: "nextkairso:$CI_COMMIT_SHA"
  # Path tương đối → SSH coi là trong home của DEPLOY_USER (~/kairso/web). Override được
  # bằng biến cùng tên ở Settings → CI/CD → Variables.
  DEPLOY_DIR: "kairso/web"

build:
  stage: build
  image: docker:27
  interruptible: true
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - |
      for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info >/dev/null || { echo "Không kết nối được dind (runner cần privileged = true)"; exit 1; }
  script:
    # NEXT_PUBLIC_* được nướng vào bundle lúc build → .env.production phải có mặt KHI build
    # (nó bị gitignore nên không nằm trong checkout). Ghi ra từ biến File rồi `next build`
    # tự đọc. Biến runtime (APP_SIGNATURE_SECRET…) vẫn chỉ nạp qua env_file lúc chạy, không
    # bị nướng vào image.
    - test -f "$WEB_ENV_PRODUCTION"
    - cp "$WEB_ENV_PRODUCTION" .env.production
    - docker build --pull -f Dockerfile -t "$WEB_IMAGE" .
    - docker save "$WEB_IMAGE" | gzip > web-image.tar.gz
  artifacts:
    expire_in: 1 day
    paths:
      - web-image.tar.gz
      - docker-compose.prod.yml

deploy:
  stage: deploy
  image: alpine:3.22
  resource_group: production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/   # only deploy to server on a v* tag
  needs:
    - job: build
      artifacts: true
  before_script:
    - test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_DIR"
    - test -n "$TUNNEL_TOKEN"
    - test -f "$WEB_ENV_PRODUCTION"
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_deploy 2>/dev/null || printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - PORT="${DEPLOY_SSH_PORT:-22}"
    - SSH="ssh -i ~/.ssh/id_deploy -p $PORT $DEPLOY_USER@$DEPLOY_HOST"
    - SCP="scp -i ~/.ssh/id_deploy -P $PORT"
    # .env cho compose interpolation (WEB_IMAGE, TUNNEL_TOKEN)
    - |
      umask 077
      printf 'WEB_IMAGE=%s\nTUNNEL_TOKEN=%s\n' "$WEB_IMAGE" "$TUNNEL_TOKEN" > compose.env
    - $SSH "mkdir -p '$DEPLOY_DIR'"
    - gzip -dc web-image.tar.gz | $SSH "docker load"
    # Copy lên server với tên chuẩn docker-compose.yml → trên server chạy `docker compose` trần (không cần -f)
    - $SCP docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml"
    - $SCP compose.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env"
    - $SCP "$WEB_ENV_PRODUCTION" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env.production"
    - $SSH "cd '$DEPLOY_DIR' && docker compose up -d --remove-orphans && docker compose ps"
    # Keep only the image just deployed so repeated deploys don't fill the disk.
    - $SSH "docker images --format '{{.Repository}}:{{.Tag}}' | grep '^nextkairso:' | grep -vxF '$WEB_IMAGE' | xargs -r docker rmi; docker image prune -f >/dev/null" || true

# ----------------------------------------------------------------------------
# Publish image public (multi-arch amd64+arm64) lên Docker Hub khi push tag v*.
# KHÔNG nạp .env.production — image public dùng runtime config (/env-config.js).
# CI/CD Variables cần: DOCKERHUB_USER, DOCKERHUB_TOKEN, DOCKERHUB_NAMESPACE.
release:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - |
      for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info >/dev/null || { echo "dind chưa sẵn sàng (runner cần privileged = true)"; exit 1; }
    - test -n "$DOCKERHUB_NAMESPACE" || { echo "Thiếu DOCKERHUB_NAMESPACE"; exit 1; }
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker run --privileged --rm tonistiigi/binfmt --install all
    # buildx refuses TLS settings taken from env (dind); build from a context.
    - docker context inspect kairso-ctx >/dev/null 2>&1 || docker context create kairso-ctx
    - docker buildx create --use --name kairso kairso-ctx
  script:
    - IMG="$DOCKERHUB_NAMESPACE/kairso-web"
    - docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile
      -t "$IMG:$CI_COMMIT_TAG" -t "$IMG:latest" --push .
